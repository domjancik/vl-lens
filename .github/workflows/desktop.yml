name: Windows desktop release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-desktop.txt
      - run: python scripts/build_desktop.py
      - name: SHA-256 checksum
        shell: pwsh
        run: |
          $digest = (Get-FileHash dist/VL-Lens-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$digest  VL-Lens-Windows-x64.zip" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VL-Lens-Windows-x64
          path: |
            dist/VL-Lens-Windows-x64.zip
            dist/SHA256SUMS.txt
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --title "VL Lens $env:GITHUB_REF_NAME" --generate-notes
          }
          gh release upload "$env:GITHUB_REF_NAME" dist/VL-Lens-Windows-x64.zip dist/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --clobber
